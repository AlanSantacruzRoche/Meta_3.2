openapi: 3.0.3
info:
  title: eSports Players and Rosters API
  version: 1.0.0
  description: API REST para gestionar jugadores y rosters de eSports. Las operaciones de escritura requieren Bearer token de administrador.
servers:
  - url: http://localhost:3000/api/v1
components:
  securitySchemes:
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: Token
  schemas:
    Jugador:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nickname: { type: string, example: Faker }
        nombre_real: { type: string, nullable: true, example: Lee Sang-hyeok }
        pais: { type: string, nullable: true, example: Corea del Sur }
        rol: { type: string, enum: [Top, Jungle, Mid, ADC, Support] }
        estado: { type: string, enum: [activo, inactivo] }
    RosterJugador:
      type: object
      required: [id_jugador, rol_en_roster]
      properties:
        id_roster: { type: integer, example: 1 }
        id_jugador: { type: integer, example: 1 }
        rol_en_roster: { type: string, enum: [Titular, Suplente] }
    Roster:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: TL Principal }
        juego: { type: string, example: League of Legends }
        tipo: { type: string, enum: [Principal, Academy] }
        temporada: { type: string, example: '2026' }
paths:
  /health:
    get:
      summary: Verificar estado de API y base de datos
      responses:
        '200': { description: API y base de datos disponibles }
        '503': { description: Base de datos no disponible }
        '500': { description: Error interno del servidor }
  /roles:
    get:
      summary: Listar roles de jugador válidos
      responses:
        '200': { description: Lista de roles }
        '500': { description: Error interno del servidor }
  /estados:
    get:
      summary: Listar estados válidos
      responses:
        '200': { description: Lista de estados }
        '500': { description: Error interno del servidor }
  /tipos-roster:
    get:
      summary: Listar tipos de roster válidos
      responses:
        '200': { description: Lista de tipos }
        '500': { description: Error interno del servidor }
  /jugadores:
    get:
      summary: Listar y filtrar jugadores
      parameters:
        - in: query
          name: rol
          schema: { type: string, enum: [Top, Jungle, Mid, ADC, Support] }
        - in: query
          name: estado
          schema: { type: string, enum: [activo, inactivo] }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200': { description: Lista de jugadores }
        '400': { description: Filtro inválido }
        '500': { description: Error interno del servidor }
    post:
      summary: Crear jugador
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname, rol]
              properties:
                nickname: { type: string }
                nombre_real: { type: string }
                pais: { type: string }
                rol: { type: string, enum: [Top, Jungle, Mid, ADC, Support] }
                estado: { type: string, enum: [activo, inactivo], default: activo }
      responses:
        '201': { description: Jugador creado }
        '400': { description: Datos inválidos }
        '401': { description: Falta token de administrador }
        '409': { description: Nickname duplicado }
        '500': { description: Error interno del servidor }
  /jugadores/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      summary: Obtener detalle de jugador
      responses:
        '200': { description: Detalle de jugador }
        '404': { description: Jugador no encontrado }
    put:
      summary: Actualizar jugador
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Jugador' }
      responses:
        '200': { description: Jugador actualizado }
        '400': { description: Datos inválidos o ID inválido }
        '401': { description: No autorizado }
        '404': { description: Jugador no encontrado }
        '409': { description: Nickname duplicado }
        '500': { description: Error interno del servidor }
    delete:
      summary: Eliminar jugador
      security: [{ AdminBearer: [] }]
      responses:
        '204': { description: Jugador eliminado }
        '400': { description: ID inválido }
        '401': { description: No autorizado }
        '404': { description: Jugador no encontrado }
        '500': { description: Error interno del servidor }
  /rosters:
    get:
      summary: Listar rosters
      parameters:
        - in: query
          name: tipo
          schema: { type: string, enum: [Principal, Academy] }
        - in: query
          name: temporada
          schema: { type: string }
      responses:
        '200': { description: Lista de rosters con cantidad de jugadores }
        '400': { description: Filtro inválido }
        '500': { description: Error interno del servidor }
    post:
      summary: Crear roster
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, temporada]
              properties:
                nombre: { type: string }
                juego: { type: string, default: League of Legends }
                tipo: { type: string, enum: [Principal, Academy], default: Principal }
                temporada: { type: string, example: '2026' }
      responses:
        '201': { description: Roster creado }
        '400': { description: Datos inválidos }
        '401': { description: No autorizado }
        '500': { description: Error interno del servidor }
  /rosters/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      summary: Obtener roster con sus jugadores
      responses:
        '200': { description: Detalle del roster }
        '400': { description: ID inválido }
        '404': { description: Roster no encontrado }
        '500': { description: Error interno del servidor }
    put:
      summary: Actualizar roster
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Roster' }
      responses:
        '200': { description: Roster actualizado }
        '400': { description: Datos inválidos o ID inválido }
        '401': { description: No autorizado }
        '404': { description: Roster no encontrado }
        '500': { description: Error interno del servidor }
    delete:
      summary: Eliminar roster sin eliminar los jugadores
      security: [{ AdminBearer: [] }]
      responses:
        '204': { description: Roster eliminado }
        '400': { description: ID inválido }
        '401': { description: No autorizado }
        '404': { description: Roster no encontrado }
        '500': { description: Error interno del servidor }
  /rosters/{id}/jugadores:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      summary: Listar jugadores asignados a un roster
      responses:
        '200': { description: Jugadores del roster }
        '400': { description: ID inválido }
        '404': { description: Roster no encontrado }
        '500': { description: Error interno del servidor }
    post:
      summary: Asignar jugador a roster
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RosterJugador' }
      responses:
        '201': { description: Jugador asignado }
        '400': { description: Datos inválidos o ID inválido }
        '401': { description: No autorizado }
        '404': { description: Roster o jugador no encontrado }
        '409': { description: Límite de titulares, rol duplicado o asignación repetida }
        '500': { description: Error interno del servidor }
  /rosters/{id}/jugadores/{id_jugador}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
      - in: path
        name: id_jugador
        required: true
        schema: { type: integer }
    put:
      summary: Cambiar rol del jugador dentro del roster
      security: [{ AdminBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol_en_roster]
              properties:
                rol_en_roster: { type: string, enum: [Titular, Suplente] }
      responses:
        '200': { description: Asignación actualizada }
        '400': { description: Datos inválidos o ID inválido }
        '401': { description: No autorizado }
        '404': { description: Roster, jugador o asignación no encontrados }
        '409': { description: Conflicto con las reglas del roster }
        '500': { description: Error interno del servidor }
    delete:
      summary: Quitar jugador del roster
      security: [{ AdminBearer: [] }]
      responses:
        '204': { description: Jugador quitado del roster }
        '400': { description: ID inválido }
        '401': { description: No autorizado }
        '404': { description: Asignación no encontrada }
        '500': { description: Error interno del servidor }
